name: Update Codex plugin pin

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

concurrency:
  group: update-codex-plugin
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-codex-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Create or refresh the update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          marketplace_file=".agents/plugins/marketplace.json"
          git_auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          git_with_token() {
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $git_auth_header" \
              git "$@"
          }

          # Rebuild the update branch from the latest main commit on every run.
          git_with_token fetch origin main
          git reset --hard FETCH_HEAD
          current_sha="$(jq -r '.plugins[] | select(.name == "younsang-codex-plugin") | .source.sha // empty' "$marketplace_file")"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The marketplace plugin source must have a pinned 40-character SHA."
            exit 1
          fi

          pnpm update-codex-plugin
          upstream_sha="$(jq -r '.plugins[] | select(.name == "younsang-codex-plugin") | .source.sha // empty' "$marketplace_file")"
          if [[ ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The update script did not produce a 40-character commit SHA."
            exit 1
          fi
          if [[ "$upstream_sha" == "$current_sha" ]]; then
            echo "The latest main commit already pins the latest upstream plugin commit."
            exit 0
          fi

          short_sha="${upstream_sha:0:12}"
          branch="automation/update-younsang-codex-plugin"

          # Keep a declined update's branch intact; use a new branch for a later SHA.
          closed_stable_pr="$(gh pr list --state closed --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -n "$closed_stable_pr" ]]; then
            branch="${branch}-${short_sha}"
          fi

          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            closed_pr="$(gh pr list --state closed --head "$branch" --json number --jq '.[0].number // empty')"
            if [[ -n "$closed_pr" ]]; then
              echo "An update pull request for $upstream_sha was already closed; leaving that decision in place."
              exit 0
            fi
          fi

          create_pr() {
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update Younsang Codex plugin to ${short_sha}" \
              --body "Updates the project plugin pin from ${current_sha} to ${upstream_sha}. Review the upstream changes: https://github.com/nayounsang/younsang-codex-plugin/compare/${current_sha}...${upstream_sha}"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marketplace_file"
          git commit -m "chore: update Younsang Codex plugin to ${short_sha}"
          git_with_token push --force origin "HEAD:refs/heads/${branch}"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "chore: update Younsang Codex plugin to ${short_sha}" \
              --body "Updates the project plugin pin from ${current_sha} to ${upstream_sha}. Review the upstream changes: https://github.com/nayounsang/younsang-codex-plugin/compare/${current_sha}...${upstream_sha}"
            exit 0
          fi
          create_pr
